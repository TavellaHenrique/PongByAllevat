
name: Build Linux Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      
      - name: Download baseline Python runtime
        shell: bash
        run: |
          set -euo pipefail

          # Retrieve the latest standalone Python release tag.
          RELEASE_TAG=$(curl -fsSL \
            https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest \
            | jq -r '.tag_name')

          # Find the CPython 3.12 baseline x86-64 GNU runtime.
          DOWNLOAD_URL=$(curl -fsSL \
            "https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/${RELEASE_TAG}" \
            | jq -r '.assets[].browser_download_url
              | select(test("cpython-3\\.12\\.[0-9]+\\+.*-x86_64-unknown-linux-gnu-install_only_stripped\\.tar\\.gz$"))')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Compatible Python runtime was not found."
            exit 1
          fi

          # Download and extract the standalone Python runtime.
          mkdir -p "$RUNNER_TEMP/python-runtime"
          curl -fsSL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/python-runtime.tar.gz"
          tar -xzf "$RUNNER_TEMP/python-runtime.tar.gz" \
            -C "$RUNNER_TEMP/python-runtime"

          # Define the Python executable path.
          PYTHON_BIN="$RUNNER_TEMP/python-runtime/python/bin/python3.12"

          if [ ! -x "$PYTHON_BIN" ]; then
            echo "Python 3.12 executable was not found."
            find "$RUNNER_TEMP/python-runtime" -type f -name "python*" -print
            exit 1
          fi

          # Export the executable path for subsequent workflow steps.
          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"

      - name: Verify Python runtime
        run: |
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -c "import platform; print(platform.machine())"

      - name: Install dependencies
        env:
          PYGAME_DETECT_AVX2: ""
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install -r requirements.txt
          "$PYTHON_BIN" -m pip install pyinstaller

      - name: Build executable
        run: |
          "$PYTHON_BIN" -m PyInstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name Pong \
            main.py

      - name: Rename executable
        run: |
          mv dist/Pong "Pong-By-Allevat-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "Pong-By-Allevat-${GITHUB_REF_NAME}-linux-x86_64"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "Pong-By-Allevat-${GITHUB_REF_NAME}-linux-x86_64"
